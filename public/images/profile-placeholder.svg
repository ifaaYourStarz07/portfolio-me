<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B1A55"/>
      <stop offset="60%" stop-color="#070F2B"/>
      <stop offset="100%" stop-color="#535C91"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7286D3"/>
      <stop offset="100%" stop-color="#8EA7E9"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#535C91" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="600" height="700" fill="url(#bgGrad)"/>
  <rect width="600" height="700" fill="url(#grid)"/>

  <!-- Geometric Abstract Aura -->
  <circle cx="300" cy="300" r="180" fill="none" stroke="#7286D3" stroke-width="2" stroke-dasharray="8 6" opacity="0.6"/>
  <circle cx="300" cy="300" r="140" fill="#1B1A55" stroke="#9290C3" stroke-width="1.5" opacity="0.8"/>
  <circle cx="300" cy="300" r="90" fill="url(#accentGrad)" opacity="0.15"/>

  <!-- Minimalist Avatar Silhouette -->
  <circle cx="300" cy="240" r="55" fill="#9290C3" opacity="0.85"/>
  <path d="M 200 420 C 200 330, 400 330, 400 420 Z" fill="#7286D3" opacity="0.75"/>

  <!-- Creative Coding Corner Accents -->
  <path d="M 40 40 L 90 40 M 40 40 L 40 90" stroke="#8EA7E9" stroke-width="2" fill="none"/>
  <path d="M 560 40 L 510 40 M 560 40 L 560 90" stroke="#8EA7E9" stroke-width="2" fill="none"/>
  <path d="M 40 660 L 90 660 M 40 660 L 40 610" stroke="#8EA7E9" stroke-width="2" fill="none"/>
  <path d="M 560 660 L 510 660 M 560 660 L 560 610" stroke="#8EA7E9" stroke-width="2" fill="none"/>

  <!-- Code Monospace Motif -->
  <text x="300" y="500" font-family="monospace" font-size="14" fill="#E5E0FF" text-anchor="middle" letter-spacing="2">
    &lt;developer: creative student /&gt;
  </text>

  <!-- Clear Placeholder Notice Badge -->
  <rect x="110" y="550" width="380" height="42" rx="8" fill="#070F2B" stroke="#7286D3" stroke-width="1.5"/>
  <text x="300" y="576" font-family="sans-serif" font-weight="600" font-size="13" fill="#FFF2F2" text-anchor="middle" letter-spacing="1">
    [ FOTO PROFIL SEMENTARA / PLACEHOLDER ]
  </text>
  <text x="300" y="620" font-family="sans-serif" font-size="12" fill="#9290C3" text-anchor="middle">
    Ganti dengan file foto asli Anda di public/images/profile.jpg
  </text>
</svg>
